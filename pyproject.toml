[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-mcp-deployment"
version = "0.1.0"
description = "MCP server for managing Power BI assets with versioning and metadata tracking"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Miguel Egea", email = "miguel.egea@gmail.com"}
]
keywords = ["powerbi", "mcp", "semantic-model", "report", "versioning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "msal>=1.20.0",
    "requests>=2.28.0",
    "pywin32>=305",
    "azure-identity>=1.12.0",
    "mcp>=0.9.0",
    "duckdb>=0.9.0",
    "GitPython>=3.1.40",
    "python-dateutil>=2.8.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
powerbi-mcp-deployment = "powerbi_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/megeagomez/PowerBiDeploymentMCP"
Issues = "https://github.com/megeagomez/PowerBiDeploymentMCP/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["powerbi_mcp_server*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
